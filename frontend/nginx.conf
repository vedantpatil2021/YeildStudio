# Serves the built single-page app. The 30 m map layers (cog/, ~1.2 GB) are not in the image; docker-compose.yml
# mounts frontend/public/cog read-only at /usr/share/nginx/html/cog.
log_format json_access escape=json
    '{"time":"$time_iso8601","logger":"nginx.access","level":"info","client":"$remote_addr",'
    '"method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"duration_ms":$request_time,"referer":"$http_referer","user_agent":"$http_user_agent"}';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # one JSON object per request, to stdout -> Alloy -> Loki
    access_log /dev/stdout json_access;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/geo+json;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # hashed build output: cache for a year
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

    # Cloud-Optimized GeoTIFFs are read with HTTP range requests (nginx supports them for static files)
    location /cog/ { expires 1h; try_files $uri =404; }

    # client-side routes such as /explore load index.html, which then routes
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
